name: Deploy to shared hosting

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Upload production files
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Deploy over SSH
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_USER: ${{ secrets.SSH_USER }}
          WORK_DIR: ${{ secrets.WORK_DIR }}
        shell: bash
        run: |
          set -Eeuo pipefail

          install -d -m 700 "$HOME/.ssh"

          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/deploy_key"
          chmod 600 "$HOME/.ssh/deploy_key"

          ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" \
            >> "$HOME/.ssh/known_hosts"

          ssh_options=(
            -i "$HOME/.ssh/deploy_key"
            -o IdentitiesOnly=yes
            -p "$SSH_PORT"
          )

          scp_options=(
            -i "$HOME/.ssh/deploy_key"
            -o IdentitiesOnly=yes
            -P "$SSH_PORT"
          )

          remote="$SSH_USER@$SSH_HOST"
          remote_archive="/tmp/cos3712-${GITHUB_RUN_ID}.tar.gz"
          archive="$(mktemp "${RUNNER_TEMP}/cos3712.XXXXXX.tar.gz")"

          tar -czf "$archive" \
            --exclude='./.git' \
            --exclude='./.github' \
            --exclude='./examples' \
            --exclude='./docs' \
            --exclude='./README.md' \
            .

          # Fail here with a useful error instead of allowing scp to fail ambiguously.
          test -s "$archive"
          echo "Created deployment archive: $archive"
          ls -lh "$archive"

          echo "Uploading deployment archive..."
          scp \
            "${scp_options[@]}" \
            "$archive" \
            "$remote:$remote_archive"

          echo "Extracting deployment..."
          ssh \
            "${ssh_options[@]}" \
            "$remote" \
            "mkdir -p -- $(printf '%q' "$WORK_DIR") &&
             tar -xzf $(printf '%q' "$remote_archive") \
               -C $(printf '%q' "$WORK_DIR") &&
             rm -f $(printf '%q' "$remote_archive")"

          rm -f "$archive"
          echo "Deployment complete."